# PR/push 시 lint와 프로덕션 빌드가 통과하는지 확인
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint-and-build:
    name: lint-and-build
    runs-on: ubuntu-latest
    # 상한이 없으면 GitHub 기본값 6시간이 걸린다 (근거: e2e/README.md 「CI 시간 상한」).
    timeout-minutes: 10
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # 워크트리 잠금의 실패는 조용하다 — 둘이 함께 들어가도 에러가 나지 않는다.
      # lint·build 가 볼 수 없어 따로 돌린다 (scripts/worktree/slots.test.mjs).
      - name: Worktree script tests
        run: pnpm test:unit

      # schema.sql 반영 누락은 tsc·lint·build 가 보지 못한다 (SQL 파일이라서).
      - name: Check schema.sql reflects migrations
        run: pnpm db:check

      - name: Build
        run: pnpm build

  e2e:
    name: e2e
    # main 병합 전 게이트 — PR 이벤트에서만 실행(병합 후 push 재실행 불필요).
    if: github.event_name == 'pull_request'
    # 전 PR 이 테스트 계정 하나를 공유하므로 러너를 가로질러 직렬화한다.
    # 그룹 이름은 PR·브랜치와 무관하게 고정 (근거·한계: e2e/README.md).
    concurrency:
      group: e2e-shared-account
      cancel-in-progress: false
      # 기본값(single)은 pending 을 1개만 두고 나머지를 취소한다 — 게이트가
      # 실행도 못 해 보고 죽는다. max 로 FIFO 대기시킨다.
      queue: max
    runs-on: ubuntu-latest
    # 직렬화는 "실행 중인 job 은 언젠가 끝난다"를 전제한다 — 상한이 그 전제를
    # 지킨다. 값의 근거와 조이는 조건: e2e/README.md 「CI 시간 상한」.
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      E2E_TEST_USER_EMAIL: ${{ secrets.E2E_TEST_USER_EMAIL }}
      E2E_TEST_USER_PASSWORD: ${{ secrets.E2E_TEST_USER_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # apt 는 끊긴 커넥션이 아니라 멈춘 커넥션에는 기본 타임아웃이 없다.
      # --with-deps 가 부르는 apt-get update 가 그 경로를 탄다.
      - name: apt 네트워크 상한 설정
        run: |
          sudo tee /etc/apt/apt.conf.d/99timeout >/dev/null <<'EOF'
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          Acquire::Retries "3";
          EOF

      - name: Resolve Playwright version
        id: playwright-version
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      # 브라우저 바이너리 다운로드 분산을 없앤다. 캐시가 적중해도 --with-deps 의
      # apt 경로는 남으므로 위 상한이 함께 필요하다.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        timeout-minutes: 20
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
